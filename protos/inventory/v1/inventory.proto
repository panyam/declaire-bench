syntax = "proto3";

package inventory.v1;

option java_multiple_files = true;
option java_package = "dev.declairebench.inventory.v1";

// Stock levels for items, and reservations against them.
service InventoryService {
  // Returns an item and how many are on hand.
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
  // Holds quantity of an item for an order, if enough is on hand.
  rpc ReserveItem(ReserveItemRequest) returns (ReserveItemResponse);
}

message Item {
  string sku = 1;
  string name = 2;
  int32 on_hand = 3;
}

message GetItemRequest {
  string sku = 1;
}

message GetItemResponse {
  Item item = 1;
}

message ReserveItemRequest {
  string order_id = 1;
  string sku = 2;
  int32 quantity = 3;
}

message ReserveItemResponse {
  string reservation_id = 1;
  // On hand after the reservation.
  int32 remaining = 2;
}
