name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  protos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Lint
        run: cd protos && buf lint
      - name: Generated code is up to date
        run: cd protos && buf generate && git diff --exit-code && test -z "$(git status --porcelain)"

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: cd java && ./gradlew test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ./python
      - name: Imports resolve
        run: cd /tmp && python -c "import inventory_client.client, inventory.v1.inventory_pb2_grpc"
