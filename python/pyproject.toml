[project]
name = "inventory-client"
version = "0.1.0"
requires-python = ">=3.10"
# grpcio and protobuf match the buf plugin versions in protos/buf.gen.yaml.
dependencies = [
    "grpcio==1.84.0",
    "protobuf==7.36.2",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The generated stubs in gen/ import themselves as `inventory.v1`.
[tool.setuptools.packages.find]
where = [".", "gen"]
include = ["inventory_client*", "inventory*"]
